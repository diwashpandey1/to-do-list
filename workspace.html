<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Add, organize, and complete tasks in your Daylist workspace.">
  <title>Workspace — Daylist</title>
  <link rel="stylesheet" href="CSS/default.css">
  <link rel="stylesheet" href="CSS/navbar-footer.css">
  <link rel="stylesheet" href="CSS/workspace.css">
</head>
<body>
  <header class="site-header">
    <nav class="site-nav" aria-label="Main navigation">
      <a class="brand" href="index.html">daylist<span>.</span></a>
      <button class="nav-toggle" type="button" aria-expanded="false" aria-controls="primary-navigation">
        <span class="sr-only">Toggle navigation</span>
        <span></span><span></span><span></span>
      </button>
      <div class="nav-links" id="primary-navigation">
        <a href="index.html">Home</a>
        <a href="workspace.html" aria-current="page">Workspace</a>
        <a href="blog.html">Notes</a>
        <a href="myintro.html">About</a>
      </div>
    </nav>
  </header>

  <main class="workspace-shell">
    <aside class="task-sidebar" aria-label="Task filters">
      <p class="sidebar-label">YOUR LIST</p>
      <nav class="filter-list">
        <button class="filter-button is-active" type="button" data-filter="all" aria-pressed="true">
          <span><span class="filter-icon" aria-hidden="true">≡</span>All tasks</span><span class="filter-count" data-count="all">0</span>
        </button>
        <button class="filter-button" type="button" data-filter="today" aria-pressed="false">
          <span><span class="filter-icon" aria-hidden="true">◷</span>Today</span><span class="filter-count" data-count="today">0</span>
        </button>
        <button class="filter-button" type="button" data-filter="important" aria-pressed="false">
          <span><span class="filter-icon" aria-hidden="true">☆</span>Important</span><span class="filter-count" data-count="important">0</span>
        </button>
        <button class="filter-button" type="button" data-filter="pending" aria-pressed="false">
          <span><span class="filter-icon" aria-hidden="true">○</span>Pending</span><span class="filter-count" data-count="pending">0</span>
        </button>
        <button class="filter-button" type="button" data-filter="completed" aria-pressed="false">
          <span><span class="filter-icon" aria-hidden="true">✓</span>Completed</span><span class="filter-count" data-count="completed">0</span>
        </button>
      </nav>
      <p class="sidebar-note">Your tasks are saved on this device.</p>
    </aside>

    <section class="task-panel" aria-labelledby="workspace-title">
      <div class="workspace-heading">
        <div>
          <p class="eyebrow" id="today-date"></p>
          <h1 id="workspace-title">All tasks</h1>
          <p class="task-summary" id="task-summary" aria-live="polite"></p>
        </div>
        <label class="sort-control">Sort by
          <select id="sort-tasks">
            <option value="created">Creation date</option>
            <option value="due">Due date</option>
            <option value="alphabetical">Alphabetically</option>
          </select>
        </label>
      </div>

      <form class="task-form" id="task-form">
        <label class="sr-only" for="task-input">Task name</label>
        <input id="task-input" name="task" type="text" maxlength="240" placeholder="What needs to get done?" autocomplete="off" required>
        <label class="due-date-control" for="due-date-input">Due date</label>
        <input id="due-date-input" name="dueDate" type="date" aria-label="Optional due date">
        <button class="button button-primary add-button" type="submit">Add task <span aria-hidden="true">+</span></button>
      </form>

      <div class="task-tools">
        <label class="search-control">
          <span aria-hidden="true">⌕</span>
          <span class="sr-only">Search tasks</span>
          <input id="task-search" type="search" placeholder="Search your tasks" autocomplete="off">
        </label>
        <span class="list-label">YOUR LIST</span>
      </div>

      <ul class="task-list" id="task-list" aria-label="Tasks"></ul>
      <p class="storage-message" id="storage-message" role="status" hidden></p>
    </section>
  </main>
  <footer class="workspace-footer"><a href="index.html">← Back to Daylist home</a></footer>
  <script src="Javascript/navbar.js"></script>
  <script src="Javascript/workspace.js"></script>
</body>
</html>
